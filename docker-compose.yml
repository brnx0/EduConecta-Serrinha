services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: educonecta-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=DevStrong@Pass123
      - MSSQL_PID=Developer
      - TZ=America/Sao_Paulo
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
      - ./infra/sqlserver/seed:/seed:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'DevStrong@Pass123' -C -Q 'SELECT 1' || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'DevStrong@Pass123' -Q 'SELECT 1' || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

volumes:
  sqldata:
    driver: local
